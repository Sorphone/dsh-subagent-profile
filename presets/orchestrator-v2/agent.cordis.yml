# `orchestrator-v2` 编排者预设 V2：主 Agent 协调模式 + 梁神 V2 两阶段引导。
#
# 与官方 `standard` 预设逐行一致，仅 persona 段改写为「主协调 Agent」身份：
# 拆解任务、经宿主注册的 `dispatch` 工具（按场景选方案/预设/模型/推理强度）
# 加普通 `subagent` / `subagent_fork` / `workflow` / `ralph` 委派工具分派子任务，
# 再集成结果。`dispatch` 工具本身由 dsh-subagent-profile 宿主行注册，对所有
# 预设可见；本预设只补下面的委派工具。
#
# V2 改造（模仿梁神模式 V2，适配当前 DSH >= 0.1.2）：
# - 引入两阶段引导 `./tool-bootstrap.mjs`：第一个持久工具/调用事件之前，
#   模型只看到 Minimal 双工具（`bash` + `str_replace_editor`）与本预设的
#   persona 段，无运行时上下文、只放行白名单消息来源；锚定（或四步兜底、
#   或首轮结束）后升入 PTC 模式（单 `run_code` 工具）并恢复全量目录，
#   工作区指令与技能目录延迟一步注入。压缩后回落到受控阶段
#   （双工具 + compactionTools 核心工作集，含 dispatch/subagent 以维持委派），
#   等待新的升态信号。
# - tool-bootstrap.mjs 已适配 0.1.2：经 `session.snapshotEvents()` 读事件日志
#   （旧 `session.events` 属性已移除，直接读会每轮崩 "Cannot read properties
#   of undefined (reading 'length')"）；persona 已含 `{{cwd}}` 模板时不再追加
#   字面工作目录行。
# - 补 `str_replace_editor`（phase-1 编辑器）；win32 下补 `custom-bash`
#   （Git Bash `bash` 工具）以保住 phase-1 的 `bash` 锚点——官方 tool-bash
#   在 win32 禁用、tool-pwsh 不叫 bash，没有它 phase-1 会退化成全量目录。
#   posix 下官方 tool-bash 本身就叫 bash，无需补行。
# - 补 `command-goal`（/goal 人机命令，对齐当前官方 standard）；spawn 行补
#   `modelSelectionSettings: true`。
#
# 改编自官方 `standard` 预设与梁神模式 V2（liangshen-v2）；原始 DeepSeek
# 版权与 MIT 许可声明见开源仓库与随附 NOTICE。
#
# 本文件是 agent 平面组成：由 roster 挂载一次到 standing scope，引用它的会话
# 经 scope 父系加入，本文件注册的工具与 prompt 段覆盖每个加入的 agent；会话
# 自身状态仍按 Session/Agent 键控在插件内。宿主组成（base.cordis.yml +
# web.cordis.yml）保留预设不得拥有的东西：注册表、沙箱与审批栈、持久化、
# 模型路由。
#
# 服务行必须放在带 `isolate` realm 的 group 内：否则发布进根 realm 成为
# 进程全局单例——另一预设发布同名会冲突，宿主读者会对每个会话解析同一实例，
# `dsh-agent-presets` 挂载时拒绝。`true` 表示条目本地 realm：本 standing mount
# 私有的实例。共享 label 不会合并实例（同一 realm 符号下二次 provide 抛错），
# label 只连接 REALMS，本文件不需要。

# ── identity ────────────────────────────────────────────────────────────────

# 编排者 persona，遮蔽本 agent 的部署默认人设。
# `{{model}}` 与 `{{cwd}}` 从 agent 自身的路由与工作目录解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是主协调 Agent（Orchestrator），由 {{model}} 驱动，工作目录是 {{cwd}}。职责是「拆解 → 委派 → 集成」：把复杂任务拆成边界清晰的子任务，按场景交给合适的子 Agent，再亲自核对质量、整合成连贯交付（别原样堆砌）。

      委派：优先 dispatch 按场景选方案（swap-standard=标准编码、researcher=调研检索，可在「子 Agent 方案」设置页自定义）；多轮可续探索用 subagent/subagent_fork，多路批量并行用 workflow，长任务反复迭代用 ralph；能后台并行就 run_in_background，不要串行干等。

      prompt 必须自包含：子 Agent 看不到你的对话，写全背景、目标、期望产出、验收标准与禁止事项。

      边界：子 Agent 能力 ⊆ 你，派发不豁免父会话的审批要求；子 Agent 失败或超出权限时自己接手重做，或用 ask_user_question 向用户澄清。

# 两阶段输入引导（同梁神 V2 的 tool-bootstrap）：在第一个持久 tool/call 事件
# 之前，模型只看到 `bash` + `str_replace_editor` 双工具与本预设 persona 段、
# 无运行时上下文、只放行白名单消息来源（直接用户消息 + goal 自动轮次）。
# anchorGate 让升态保持到首个 minimal-like 推理块（四步兜底）；
# promoteAfterFirstResponse 避免无工具首答后永久双工具，并在首轮结束时释放
# 锚门会话。升态后目录以 PTC 模式呈现（线上单一 run_code 工具，步边界切换），
# 工作区指令与技能目录延迟一步；bootstrapMaxTokens 封顶 phase-1 输出预算
# （1024），升态后再剥离。压缩后回落到受控阶段（双工具 + compactionTools），
# 直到新升态信号——本预设把 dispatch/subagent 加进 compactionTools，
# 让压缩后的编排者仍能继续委派。
- id: tool-bootstrap
  name: ./tool-bootstrap.mjs
  config:
    shellTools: [bash]
    commonTools: [str_replace_editor]
    messageSources: [user, goal]
    anchorGate: true
    maxBootstrapSteps: 4
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 1024
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question, dispatch, subagent]
    deferredSources: [agent-instructions, skill-catalog]
    deferredGraceSteps: 1
    promotedPresentation: code
    # 升态后以一次性非指令式提示替代 AGENTS.md 全文注入（梁神 V2 保留的
    # issue #388 设定），知识经 read / skill_load 可达。设 false 恢复全文注入。
    instructionHint: true

# 工作区指令在 phase 1 被 tool-bootstrap 隔离，升态后延迟一步注入并保持更新。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` 留在宿主组成：apps/cli/src/web.ts 注入它以发布
# DSH_WEB_URL/DSH_WEB_MODE，且宿主行注入服务即宿主平面归属标准——注入在
# 会话存在前解析，没有可归属的 agent；放预设 realm 里这些变量到不了模型
# 的 shell。两个 shell 工具在此消费宿主注册表；其执行器
# （bash-sandbox/pwsh-sandbox）也在宿主平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# win32 专用 `bash` 工具（custom-bash.mjs，同梁神 V2）：官方 tool-bash 在
# win32 禁用、tool-pwsh 又不叫 bash，phase-1 的 Minimal 锚点（shellTools:
# [bash]）会找不到 shell 而退化成全量目录。此工具经跨平台 subprocess 缝隙
# 执行 Git Bash（`bash -c`），保住锚点；posix 下官方 tool-bash 已提供
# 同名工具，此行走禁用。非零退出上报不抛；调用间状态不持久；Windows 无
# OS 沙箱限制。`bashPath` 可选（缺省按 Git 安装根推断）。
- id: custom-bash
  name: ./custom-bash.mjs
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Phase-1 编辑器（同梁神 V2）：顶层直排，复用宿主沙箱 ctx.fs 而非裸本地
# 文件系统，schema 与官方 Minimal `str_replace_editor` 一致。
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# 两者都注册进宿主 tools 注册表且不提供服务，无需 realm；fs 服务与其策略留在宿主。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# 只放模型可见的控制。任务注册表留在宿主平面：其生产者在本文件任何 realm
# 之外（上面 tool-bash 用 ctx.get 解析它，条目本地 realm 对兄弟行不可见），
# 否则 run_in_background 会答「后台任务不可用」。注册表本就按所属 agent
# 键控，一个宿主实例服务所有会话；预设只决定其 agent 能否收集/停止后台任务。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# skill 注册表在宿主组成中按 scope 分层；以下行注册进本预设的那一层，
# 无需 realm。`skill-filesystem` 为本预设的 agent 提供本地根发现，
# `tool-skill` 提供目录与加载器；合并后的目录也包含部署全局注册的内容。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# goal 服务与会话驱动留在宿主平面，Gateway 在那里解析它们。人机命令与
# 模型可见工具注册进本预设的 scope 层。
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

# 只放模型可见的工具。goal 服务与会话驱动留在宿主平面：Gateway 以 Remote
# endpoint 服务 goal 域，接收方来自生成描述符，条目本地 realm 会隐藏它。
# 注册表本就按会话键控，一个宿主实例服务所有会话；预设只决定其 agent
# 能否调用 goal 工具。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# plan 状态按 agent 天然独立，条目本地 realm 正是正确的生命周期。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` 经 ctx.get 读取 toolResultPrune，pruner 必须与本 realm
# 共享而非留在外面。
#
# `tokenMeter` 刻意不在本 realm：meter 留在宿主平面，此处各行解析那个单例。
# 它无配置、按 Session 键控每次 fold，且持有浏览器为每个会话读取的上下文
# 计量单位——进 realm 会随挂载的预设增减。预设只决定其 agent 是否压缩，
# 即下面的 compaction-basic。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# `subagents` 注册表及其 spawn/fork 后端在宿主组成中：注册表是进程单例，
# api-proxy 供浏览器跨会话查询，provider 名只能注册一次。本预设贡献
# delegation 工具，解析该宿主注册表。`dispatch` 工具（及其驱动的 profile
# provider）由 dsh-subagent-profile 宿主行注册，宿主全局可见；本组补普通
# subagent/workflow 工具，让编排者选最省成本的方式。
#
# `workflows` 不同——没有 agent 之外的东西读它——到达它的行共享本条目本地
# realm，留在外面的消费者会解析到本预设未填充的宿主注册表。
#
# `tool-subagent-report` 与注册表同理在宿主平面：它在那个单例上注册
# continuable setup 而非本 agent 调用的工具，且 setup 列表不感知 scope——
# 每个挂载的预设各注册一份，每个子 agent 都会重复注册 `report`，第二次抛错。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 生产版 dsh 不安装这些可选 provider。在本 Profile 安装对应 Bundle 并
    # 重启宿主，再复制本预设、移除对应行的 disabled。宿主可用性本身不授予工具。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# `web` 服务及其搜索 provider 留在宿主组成；只有模型可见的工具按会话。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
